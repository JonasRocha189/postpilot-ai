[project]
name = "postpilot-backend"
version = "0.1.0"
description = "PostPilot API: social media post generator with an AI agent and RAG"
readme = "README.md"
requires-python = ">=3.11.5"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "boto3>=1.43.123",
    "fastapi[standard]>=0.162.0",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=26.1.0",
    "truststore>=0.10.5",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.123",
    "moto[s3]>=5.2.5",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "D",    # docstrings
]
ignore = [
    "D100", # module docstring
    "D104", # package docstring
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependencies are declared as default arguments on purpose.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/versions/"]
# Packages have no __init__.py; resolve modules from the backend root.
mypy_path = "."
explicit_package_bases = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
# Import modules from the backend root (api, database, main), like the app does
pythonpath = ["."]
testpaths = ["tests"]
# Summary of skipped/failed tests at the end
addopts = "-ra"
