name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the old run; runs on main are never cancelled
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/jonasrocha189/postpilot-backend
  APP_URL: https://postpilot.jonas-rocha.com

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.1"
          python-version: "3.12" # same as the Docker image
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest tests/unit
      # Testcontainers starts pgvector/pgvector (Docker is preinstalled on the runner)
      - run: uv run pytest tests/integration

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npx vite build

  e2e:
    name: Acceptance (Playwright, mock API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  image:
    name: Build and push image (GHCR)
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (Render + Vercel)
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://postpilot.jonas-rocha.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      # Render pulls exactly the image built above (tag = commit SHA)
      - name: Deploy backend (Render)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST -G "$HOOK" --data-urlencode "imgURL=${IMAGE}:${GITHUB_SHA}" -o /dev/null
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Vercel builds with the VITE_* variables set in its dashboard
      - name: Deploy frontend (Vercel)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@65.12.1 deploy --prod --yes --token="$VERCEL_TOKEN"

  smoke:
    name: Smoke test (production)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      # Up to 10 min: Render pulls the image, runs the migrations and may be waking up
      - name: API is ready
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 30 "$APP_URL/api/v1/health/ready"; then exit 0; fi
            echo "waiting ($i/30)..."; sleep 20
          done
          exit 1
      - name: Frontend routes return the app
        run: |
          for path in / /posts /login; do
            curl -fsS -o /dev/null "$APP_URL$path"
          done
