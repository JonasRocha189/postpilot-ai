services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postpilot
      POSTGRES_PASSWORD: postpilot
      POSTGRES_DB: postpilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postpilot -d postpilot"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
