services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postpilot
      POSTGRES_PASSWORD: postpilot
      POSTGRES_DB: postpilot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postpilot -d postpilot"]
      interval: 5s
      retries: 10

  # Local S3 (LocalStack). Endpoint http://localhost:4566, credentials test/test.
  # Production uses the real AWS bucket through the same S3_* variables.
  s3:
    image: localstack/localstack:4.4
    environment:
      SERVICES: s3
    ports:
      - "4566:4566"
    volumes:
      # Creates the bucket (with CORS for the Vite dev server) on startup
      - ./infra/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3api head-bucket --bucket postpilot-dev"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
